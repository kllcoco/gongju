name: 大模型字典 APK

on:
  push:
    paths:
      - 'llm-dict/**'
      - '.github/workflows/llm-dict-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llm-dict-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 打包
        working-directory: llm-dict
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: 检查 APK
        working-directory: llm-dict
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.log
          "$BT/aapt2" dump badging "$APK" | head -20 | tee -a verify.log
          unzip -l "$APK" | grep -c "assets/www/" | tee -a verify.log
          cp "$APK" "$GITHUB_WORKSPACE/llm-dict.apk"
          sha256sum "$GITHUB_WORKSPACE/llm-dict.apk" | tee -a verify.log

      - uses: actions/upload-artifact@v4
        with:
          name: llm-dict-apk
          path: llm-dict.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete llm-dict-latest --yes --cleanup-tag || true
          gh release create llm-dict-latest llm-dict.apk \
            --target "$GITHUB_SHA" \
            --title "大模型字典（最新版）" \
            --notes "离线知识点字典，安卓手机下载 llm-dict.apk 安装。构建编号 $GITHUB_RUN_NUMBER。"

      - name: 把构建结果记到 llm-dict-buildlog 分支
        if: always()
        run: |
          mkdir -p /tmp/bl && cd /tmp/bl && git init -q -b llm-dict-buildlog
          cp "$GITHUB_WORKSPACE/llm-dict/build.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/llm-dict/verify.log" . 2>/dev/null || true
          tail -c 60000 build.log > build-tail.log 2>/dev/null || true
          rm -f build.log
          echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA status=${{ job.status }}" > status.txt
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "build log for run $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" llm-dict-buildlog
