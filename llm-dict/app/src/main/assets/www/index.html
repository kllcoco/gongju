<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>大模型字典</title>
<script>try{var t=JSON.parse(localStorage.getItem('dict.theme')||'"auto"');if(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="主导航">
    <button data-tab="home"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>查词</span></button>
    <button data-tab="toc"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>目录</span></button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg><span>我的</span></button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
