plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'cn.llmjourney.dict'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.llmjourney.dict'
        minSdk 29
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        // 固定的调试签名：每次打出来的包签名一样，才能直接覆盖安装、不丢收藏
        fixed {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

}
